pen-gift:after{content:'';position:absolute;top:100%;left:45%;border:7px solid transparent;border-top-color:#bd5489}#open-gift[hidden]{display:none}.treasure.opening>svg{animation:treasureOpen 1.4s ease forwards}.gift-revealed:after{content:'';position:absolute;inset:0;z-index:160;pointer-events:none;background:#fff7ed;animation:giftLight 1.45s ease forwards}.ending .letter{animation:letterUnfold 1.2s ease both;transform-origin:center top}@keyframes walk{25%{transform:translateY(-3px) rotate(-2deg) scaleX(var(--face,1))}75%{transform:translateY(-3px) rotate(2deg) scaleX(var(--face,1))}}@keyframes rustle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}@keyframes flowerReveal{from{opacity:0;scale:.8;translate:0 15px}to{opacity:1;scale:1;translate:0 0}}@keyframes treasureOpen{40%{transform:translateY(-10px) rotate(-7deg)}65%{transform:translateY(-10px) rotate(7deg)}100%{transform:scale(1.35);filter:drop-shadow(0 0 35px #fff)}}@keyframes giftLight{0%,45%{opacity:0}100%{opacity:1}}@keyframes letterUnfold{0%,35%{opacity:0;transform:rotateX(-35deg) translateY(30px)}100%{opacity:1;transform:none}}
